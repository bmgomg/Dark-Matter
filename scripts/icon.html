<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eclipse icon</title>
<!-- The app icons, rendered by render-icons.sh: a total eclipse, its corona on the night sky (the app's --bg),
     with the moon and the gas giant beside it, all in the game's one hue. Layouts, as #kind-size:
     #any-N         rounded, on transparency (favicon, PWA "any")
     #apple-180     full bleed, for iOS to round
     #maskable-N    full bleed, the eclipse inside the 80% safe zone
     #svg           the SVG favicon's source, written into the page for render-icons.sh to save
     The planets drop out at favicon sizes (32 and the SVG), too small to read. -->
<style>
	body {
		margin: 0;
		background: none;
	}

	svg {
		display: block;
	}
</style>
</head>
<body>
<script>
	const [kind, n] = location.hash.slice(1).split('-');
	const size = +n || 512;
	const tiny = kind === 'svg' || size <= 32;

	// the game's one hue, as in src/palette.js (copied: a page opened from a file can't import it)
	const HUE = 248;
	const SAT = 70;
	const hex = (l) => {
		const s = SAT / 100;
		const L = l / 100;
		const k = (n) => (n + HUE / 30) % 12;
		const a = s * Math.min(L, 1 - L);
		const f = (n) => L - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
		return '#' + [0, 8, 4].map((n) => Math.round(f(n) * 255).toString(16).padStart(2, '0')).join('');
	};

	const SCALE = { any: 1, svg: 1.12, apple: 0.95, maskable: 0.82 }[kind] ?? 1;

	const planet = (x, y, r, a, b, c) =>
		`<radialGradient id="p${r}" cx="0.36" cy="0.32" r="0.78"><stop offset="0" stop-color="${a}"/><stop offset="0.35" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>` +
		`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#p${r})"/>`;

	const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="${size}" height="${size}">`
		+ '<defs>'
		+ `<radialGradient id="sky" cx="0.5" cy="0.4" r="0.75"><stop offset="0" stop-color="${hex(22)}"/><stop offset="1" stop-color="${hex(8)}"/></radialGradient>`
		+ `<radialGradient id="corona"><stop offset="0.5" stop-color="${hex(99)}"/><stop offset="0.56" stop-color="${hex(95)}" stop-opacity="0.9"/><stop offset="0.72" stop-color="${hex(70)}" stop-opacity="0.35"/><stop offset="1" stop-color="${hex(62)}" stop-opacity="0"/></radialGradient>`
		+ '</defs>'
		+ `<rect width="100" height="100" rx="${kind === 'any' || kind === 'svg' ? 22 : 0}" fill="url(#sky)"/>`
		+ `<g transform="translate(50 50) scale(${SCALE}) translate(-50 -50)">`
		+ '<circle cx="50" cy="48" r="38" fill="url(#corona)"/>'
		+ `<circle cx="50" cy="48" r="19" fill="${hex(6)}" stroke="${hex(98)}" stroke-width="0.8"/>`
		+ `<circle cx="63.5" cy="34.5" r="1.8" fill="${hex(100)}"/>`
		+ (tiny ? '' : planet(22, 74, 6, hex(97), hex(80), hex(52)) + planet(77, 72, 9, hex(60), hex(36), hex(14)))
		+ '</g></svg>';

	if (kind === 'svg') {
		const pre = document.createElement('pre');
		pre.id = 'source';
		pre.textContent = svg;
		document.body.appendChild(pre);
	} else {
		document.body.innerHTML = svg;
	}
</script>
</body>
</html>
