<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tile</title>
<!-- The itch.io page background, a seamless tile, 1024 × 1024, rendered by render-cover.sh: Space.svelte's sky, on a flat
     base, since a gradient across it couldn't repeat. The nebulae are fractal noise on lattices that wrap, and stars that
     cross an edge come back at the opposite one. Dim, and with nothing that stands out, so that the repeat doesn't show
     and the page's column stays the thing to read. -->
<style>
	html,
	body {
		margin: 0;
		background: #0a0920;
	}

	canvas {
		display: block;
	}
</style>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
	const S = 1024;
	const BASE = [10, 9, 32];
	// the nebulae, in Space.svelte's colours: each its own noise, and how strongly it shows at its densest
	const NEBULAE = [
		{ color: [107, 63, 194], strength: 0.24 },
		{ color: [21, 128, 138], strength: 0.2 },
		{ color: [176, 107, 255], strength: 0.09 }
	];
	// the noise's lattices, cells across the tile, coarsest first: halving the weight each time
	const OCTAVES = [4, 8, 16, 32, 64, 128];
	// the range of the noise that counts as cloud, below it clear sky
	const CLOUD_FROM = 0.42;
	const CLOUD_TO = 0.72;
	const CLOUD_POWER = 1.4;
	// a little noise, in levels of 255, against the bands that gradients this dark show
	const DITHER = 1.2;

	const STARS = 420;
	const STAR_TINTS = ['#ffffff', '#ffffff', '#ffffff', '#ffe9c4', '#c9d6ff', '#e6d6ff'];

	const rand = (() => {
		let a = 20261105;
		return () => {
			a = (a + 0x6d2b79f5) | 0;
			let t = Math.imul(a ^ (a >>> 15), 1 | a);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
		};
	})();

	const smooth = (t) => t * t * (3 - 2 * t);

	// one fractal noise, 0 to 1, that wraps: each lattice's far edge reads its first row and column again
	const makeNoise = () => {
		const lattices = OCTAVES.map((n) => ({ n, values: Float32Array.from({ length: n * n }, rand) }));
		const total = OCTAVES.reduce((sum, _, i) => sum + 0.5 ** i, 0);

		return (x, y) => {
			let sum = 0;

			lattices.forEach(({ n, values }, i) => {
				const u = (x / S) * n;
				const v = (y / S) * n;
				const x0 = Math.floor(u);
				const y0 = Math.floor(v);
				const x1 = (x0 + 1) % n;
				const y1 = (y0 + 1) % n;
				const fx = smooth(u - x0);
				const fy = smooth(v - y0);
				const top = values[y0 * n + x0] * (1 - fx) + values[y0 * n + x1] * fx;
				const bottom = values[y1 * n + x0] * (1 - fx) + values[y1 * n + x1] * fx;

				sum += (top * (1 - fy) + bottom * fy) * 0.5 ** i;
			});

			return sum / total;
		};
	};

	const ctx = document.getElementById('c').getContext('2d');
	const image = ctx.createImageData(S, S);
	const fields = NEBULAE.map((nebula) => ({ ...nebula, noise: makeNoise() }));

	for (let y = 0; y < S; y++) {
		for (let x = 0; x < S; x++) {
			const i = (y * S + x) * 4;
			const rgb = [...BASE];

			for (const { color, strength, noise } of fields) {
				const cloud = Math.min(1, Math.max(0, (noise(x, y) - CLOUD_FROM) / (CLOUD_TO - CLOUD_FROM))) ** CLOUD_POWER;

				for (let c = 0; c < 3; c++) {
					rgb[c] += color[c] * strength * cloud;
				}
			}

			const dither = (rand() + rand() - 1) * DITHER;

			for (let c = 0; c < 3; c++) {
				image.data[i + c] = rgb[c] + dither;
			}

			image.data[i + 3] = 255;
		}
	}

	ctx.putImageData(image, 0, 0);

	for (let i = 0; i < STARS; i++) {
		// smaller than the game's largest: a big star would mark the repeat
		const r = 0.45 + rand() ** 3 * 1.05;
		const sx = rand() * S;
		const sy = rand() * S;

		ctx.globalAlpha = 0.3 + rand() * 0.6;
		ctx.fillStyle = STAR_TINTS[Math.floor(rand() * STAR_TINTS.length)];

		// at every place it can show from: its own and the eight tiles around
		for (const dx of [-S, 0, S]) {
			for (const dy of [-S, 0, S]) {
				ctx.beginPath();
				ctx.arc(sx + dx, sy + dy, r, 0, 2 * Math.PI);
				ctx.fill();
			}
		}
	}
</script>
</body>
</html>
