<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rules</title>
<!-- The rules graphic for the itch.io page, 900 × 600, as on Hexodus's page, rendered by render-cover.sh. The difficulties
     are DIFF_NAMES; "all four sides" is Quite Hard's needsAllSides, "$1" is COST_TURN: change them with the game. -->
<style>
	@font-face {
		font-family: CZ;
		src: url('../src/lib/fonts/Cinzel.ttf');
		font-weight: 400 900;
	}

	@font-face {
		font-family: QS;
		src: url('../src/lib/fonts/Quicksand.ttf');
		font-weight: 300 700;
	}

	html,
	body {
		margin: 0;
		background: #05050f;
	}

	.card {
		position: relative;
		width: 900px;
		height: 600px;
		overflow: hidden;
		background: radial-gradient(ellipse at 50% 50%, #2a1b5e 0%, #0d0b24 68%, #05050f 100%);
		font-family: QS;
		font-weight: 500;
		color: #ece8ff;
	}

	canvas {
		position: absolute;
		inset: 0;
	}

	.text {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 36px;
	}

	.headline {
		font-size: 40px;
		line-height: 1.45;
		text-align: center;
	}

	.rule {
		width: 420px;
		height: 1px;
		background: linear-gradient(90deg, transparent, #ffd77a99, transparent);
	}

	.levels {
		display: grid;
		grid-template-columns: auto auto;
		justify-content: center;
		align-items: baseline;
		column-gap: 36px;
		row-gap: 24px;
		font-size: 32px;
	}

	.level {
		font-family: CZ;
		font-size: 34px;
		font-weight: 600;
		color: #ffd77a;
		text-shadow: 0 0 16px #ffd77a66;
	}

	.closing {
		font-size: 36px;
		color: #c9b6ff;
		text-shadow: 0 0 18px #b06bff77;
	}
</style>
</head>
<body>
<div class="card">
	<canvas id="c" width="900" height="600"></canvas>
	<div class="text">
		<div class="headline">
			<div>Planets hide behind planets.</div>
			<div>Turn the board to map them all.</div>
		</div>
		<div class="rule"></div>
		<div class="levels">
			<div class="level">Easy</div>
			<div>A few looks will do.</div>
			<div class="level">Not Easy</div>
			<div>What you can't see starts to matter.</div>
			<div class="level">Quite Hard</div>
			<div>All four sides, and a long think.</div>
		</div>
		<div class="rule"></div>
		<div class="closing">It takes a shift. Each one costs $1.</div>
	</div>
</div>
<script>
	// a faint sky, Space.svelte's stars, kept dim behind the text
	const rand = (() => {
		let a = 20261103;
		return () => {
			a = (a + 0x6d2b79f5) | 0;
			let t = Math.imul(a ^ (a >>> 15), 1 | a);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
		};
	})();

	const ctx = document.getElementById('c').getContext('2d');

	for (let i = 0; i < 170; i++) {
		ctx.globalAlpha = 0.12 + rand() * 0.28;
		ctx.fillStyle = '#ffffff';
		ctx.beginPath();
		ctx.arc(rand() * 900, rand() * 600, 0.4 + rand() ** 3 * 1.1, 0, 2 * Math.PI);
		ctx.fill();
	}
</script>
</body>
</html>
